name = "carolina-precision-landworks"
main = "worker.js"
compatibility_date = "2024-11-01"

# Serve the built static site from ./dist and expose it to the Worker as env.ASSETS.
# The Worker handles POST /api/send-lead itself and forwards everything else to ASSETS.
[assets]
directory = "./dist"
binding = "ASSETS"

# Bind the existing Cloudflare Secrets Store secret "RESEND_API_KEY" to the
# Worker runtime as env.RESEND_API_KEY.
[[secrets_store_secrets]]
binding = "RESEND_API_KEY"
store_id = "f61ebfeeb2845e95d193e9b5b33ff"
secret_name = "RESEND_API_KEY"

# Optional sender / recipient overrides. MAIL_FROM must be set to an address on
# your Resend-verified domain.
[vars]
MAIL_FROM = "Carolina Precision Landworks <leads@carolinaprecisionlandworks.com>"
# LEAD_TO = "CarolinaPrecisionLandworks@gmail.com"